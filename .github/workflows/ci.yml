name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Guards lint + the build_info model tests. The keystone is the schema-drift test
# (test_committed_schema_matches_model): if someone changes the BuildInfo model but
# forgets to regenerate build_info.schema.json, this goes red — protecting the
# cross-repo contract that Kestrel /health and biomapper2 run provenance depend on.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run ruff check
      run: uv run ruff check

    - name: Run black check
      run: uv run black --check .

    - name: Run tests (includes schema-drift guard)
      run: uv run pytest -v

    - name: Verify build_info.schema.json is regenerated
      run: |
        uv run python scripts/gen_build_info_schema.py
        git diff --exit-code build_info.schema.json \
          || (echo "::error::build_info.schema.json is stale — run scripts/gen_build_info_schema.py" && exit 1)
