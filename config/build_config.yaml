biolink_version: 4.2.5
sources:
  kg2:
    # RTX-KG2 has separate nodes and edges files
    nodes_input: "input_data/kg2/kg2.10.2/kg2c-2.10.2-v1.0-nodes-test.jsonl"
    edges_input: "input_data/kg2/kg2.10.2/kg2c-2.10.2-v1.0-edges-test.jsonl"
    harmonized_output:
      nodes: "artifacts/harmonized/kg2/nodes.jsonl"
      edges: "artifacts/harmonized/kg2/edges.jsonl"
    priority: 1  # Highest priority for canonical ID selection
    source_type: "separate_files"

  spoke:
    # SPOKE has mixed nodes and edges in one file
    input_file: "input_data/spoke/v6/spokeV6_test_human.jsonl"
    harmonized_output:
      nodes: "artifacts/harmonized/spoke/nodes.jsonl"
      edges: "artifacts/harmonized/spoke/edges.jsonl"
    priority: 2
    source_type: "mixed_file"

integration:
  output_directory: "artifacts/integrated/phenomekg/"
  unified_output:
    nodes: "unified_nodes.jsonl"
    edges: "unified_edges.jsonl"
  primary_source: "kg2"  # Source to use for equivalency mappings

post_processing:
  arango_export:
    enabled: true
    output_directory: "artifacts/export/arango/"
    output_files:
      nodes: "arango_nodes.jsonl"
      edges: "arango_edges.jsonl"

  biomapper_export:
    enabled: true
    output_directory: "artifacts/export/biomapper/"
    include_edges: true

metagraph:
  generate_for_sources: true  # Generate metagraph for each harmonized source
  generate_for_unified: true  # Generate metagraph for unified result
  generate_comparisons: true  # Generate comparison between source and unified metagraphs
  generate_cytoscape: true    # Generate Cytoscape visualization files
  generate_summaries: true    # Generate human-readable summaries

logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"