kraken_version: 2.4.0
biolink_version: 4.4.4
log_level: INFO
steps:
  harmonize: True
  integrate: True
  postprocess: False
options:
  metagraph_creation: True
  validate_output: True
  validation_only: False
  include_sources: []
  exclude_sources: ["clingen"]

# Base directory path to use for all input/output files (should be absolute path)
# Set to null to use kraken project root as base path
base_path: "/Volumes/AmySSD/kraken-data"

harmonization:
  output_directory: "artifacts/2.4.0-dev/harmonized/"
  zip_inputs_after: False
  validate_output: True

integration:
  output_directory: "artifacts/2.4.0-dev/integrated/"

metagraph:
  output_directory: "artifacts/2.4.0-dev/metagraphs"

post_processing:
  test_export:
    output_directory: "artifacts/2.4.0-dev/integrated/"
    num_edges: 10000

sources:
  kg2:
    source_id: "infores:rtx-kg2"
    version: "2.10.2"
    nodes_input: "input_data/kg2/kg2.10.2/kg2c-2.10.2-v1.0-nodes.jsonl"
    edges_input: "input_data/kg2/kg2.10.2/kg2c-2.10.2-v1.0-edges.jsonl"

  robokop:
    source_id: "infores:robokop-kg"
    version: "june2025"
    nodes_input: "input_data/robokop/june2025/nodes.jsonl"
    edges_input: "input_data/robokop/june2025/edges.jsonl"

  translator-kg-open:
    source_id: "translator-kg-open"  # no registered infores; bare id we coin
    version: "1.0.2"
    nodes_input: "input_data/translator-kg-open/1.0.2/nodes.jsonl"
    edges_input: "input_data/translator-kg-open/1.0.2/edges.jsonl"

  babel:
    # Babel, the equivalence build behind the SRI Node Normalizer (which is what source_id names; Babel itself
    # has no infores). Replaces querying the Node Normalizer API during entity resolution.
    source_id: "infores:sri-node-normalizer"
    version: "2026jul22"
    input_file: "input_data/babel/2026jul22"

  ncbigene:
    source_id: "infores:ncbi-gene"
    version: "accessed_2026-11-04"
    input_file: "input_data/ncbigene/2026-11-04"

  ctkg:
    source_id: "infores:clinicaltrials-kp"
    former_source_ids: ["infores:multiomics-clinicaltrials"]  # deprecated, kg2 and translator-kg-open still use it
    version: "4.2.6"
    nodes_input: "input_data/ctkg/4.2.6/clinical_trials_kg_nodes_v4.2.6.jsonl"
    edges_input: "input_data/ctkg/4.2.6/clinical_trials_kg_edges_v4.2.6.jsonl"
    # We ingest it directly, so every other source drops its second-hand copies (kg2 and
    # translator-kg-open both carry them). Covers aggregator as well as primary provenance.
    drop_from_other_sources: true

  dakg:
    source_id: "infores:multiomics-drugapprovals"
    version: "0.5.7"
    nodes_input: "input_data/dakg/drug_approvals_kg_nodes_current.jsonl"
    edges_input: "input_data/dakg/drug_approvals_kg_edges_current.jsonl"
    drop_from_other_sources: true

  microbiome-kg:
    source_id: "infores:multiomics-microbiome"
    version: "2.1.0"
    nodes_input: "input_data/microbiome-kg/Microbiome_KG_nodes_v2.1.0.tsv"
    edges_input: "input_data/microbiome-kg/Microbiome_KG_edges_p2.1.0.tsv"

  multiomics-kg:
    source_id: "infores:multiomics-multiomics"
    version: "2.1.0"
    nodes_input: "input_data/multiomics-kg/Multiomics_KG_nodes_v2.1.0.tsv"
    edges_input: "input_data/multiomics-kg/Multiomics_KG_edges_p2.1.0.tsv"

  umls:
    source_id: "infores:umls-metathesaurus"
    version: "2025AA"
    input_file: "input_data/umls/LOINC_PART_UMLS.tsv"

  lipidmaps:
    source_id: "lipidmaps"  # no registered infores; bare id we coin
    version: "accessed_2026-08-07"
    input_file: "input_data/lipidmaps/structures.sdf"

  refmet:
    source_id: "infores:refmet"
    version: "accessed_2026-08-07"
    input_file: "input_data/refmet/refmet.csv"

  loinc:
    source_id: "infores:loinc"
    version: "2.83"
    input_file: "input_data/loinc/Loinc_2.83"

  cdes:
    source_id: "nih-cde"  # no registered infores; bare id we coin
    version: "accessed_2026-07-29"
    input_file: "input_data/cdes/SearchExport.json"

  pgs-catalog:
    source_id: "pgs-catalog"  # no registered infores; bare id we coin
    version: "2026-10-23"
    input_file: "input_data/pgs-catalog/pgs_all_metadata_2026-10-23.xlsx"  # next to the cached scoring files

  bio-bmi:
    source_id: "biological-bmi"  # a paper (Watanabe et al. 2023), not a registered DB; bare id we coin
    version: "2023"  # Watanabe et al. Nat Med 2023 (doi:10.1038/s41591-023-02248-0)
    input_file: "input_data/bio-bmi"

  bio-age:
    source_id: "biological-age"  # a paper (Earls et al. 2019), not a registered DB; bare id we coin
    version: "2019"  # Earls et al. J Gerontol A 2019 (doi:10.1093/gerona/glz220)
    input_file: "input_data/bio-age"

  long-covid:
    source_id: "isb-long-covid"  # ISB's RECOVER-funded long COVID tables (Qi Wei), not a registered DB; bare id we coin
    version: "received_2026-09-17"
    input_file: "input_data/long-covid"

  icd10cm:
    source_id: "infores:icd10cm"
    version: "FY2027_mondo-sssom-accessed_2026-11-06_doid-2026-10-29"
    input_file: "input_data/icd10cm/2027"

  clingen:
    source_id: "infores:clingen"
    version: null  # TODO: fill in ClinGen release/download date
    input_file: "input_data/clingen/acmg_actionability.json"