# Branch-family map for the ER 'one branch' guardrail — SEED for review.
# Format: category -> [families]. A category may belong to MULTIPLE families
# ('bridge'), which lets it merge with either side without collapsing the
# extremes (a cluster is valid iff the intersection of families across its
# nodes is non-empty). An EMPTY list [] means WILDCARD: a non-committal
# category that never constrains a merge.
#
# COARSE ON PURPOSE: this guardrail only BLOCKS egregious cross-branch merges
# (gene/protein vs disease vs chemical vs anatomy vs organism); it never causes
# merges. Precision comes from one-id (RM/LM/MONDO) + taxon + weights. When in
# doubt, be generous. Review every line; edit freely.
#
# Key bridges: ClinicalFinding -> [clinical_obs, disease_pheno];
#   Procedure -> [clinical_obs, procedure]; NucleicAcidEntity -> [chemical, gene_protein].

