[project]
name = "kraken"
version = "2.1.0"
description = "Build system for Phenome Health's unified knowledge graph, KRAKEN"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amy Glen", email = "amy.glen@phenomehealth.org" },
    { name = "Drew Witherington" },
    { name = "Trent Leslie" },
    { name = "Andrew Baumgartner" },
    { name = "Ashen Fernando" },
    { name = "Bhargav Vemuri" },
    { name = "Ornit Nahman" },
    { name = "Gwênlyn Glusman" },
    { name = "Leroy Hood" },
    { name = "Lance Pflieger" },
    { name = "Noa Rappaport" },
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "biomapper2",
    "bmt>=1.4.5",
    "jsonlines>=4.0.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "rdkit>=2025.3.6",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=8.4.1",
    "ruff>=0.14.13",
]
viz = [
    "matplotlib>=3.10.6",
    "mpl-chord-diagram>=0.4.1",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "seaborn>=0.13.2",
    "wordcloud>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kraken"]

[tool.uv]
package = true

[tool.uv.sources]
biomapper2 = { git = "https://github.com/Phenome-Health/biomapper2.git", rev = "kraken2.1.0" }

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["kraken"]
