[project]
name = "phenome-kg"
version = "0.1.0"
description = "Build system for Phenome Health's unified KG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bmt>=1.4.5",
    "jsonlines>=4.0.0",
    "pyyaml>=6.0.2",
    "rdkit>=2025.3.6",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
viz = [
    "matplotlib>=3.10.6",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "plotly>=6.3.0",
    "seaborn>=0.13.2",
]
